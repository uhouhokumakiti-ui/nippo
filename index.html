<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1d5466">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="試錐日報">
<meta name="description" content="ボーリング現場の試錐日報を入力し、日報様式のPDFで送るアプリ">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>試錐日報</title>
<style>
:root{
  --bg:#eceeea;--card:#ffffff;--ink:#192225;--sub:#5a666a;--line:#d3d9d7;--inbg:#ffffff;
  --pri:#1d5466;--pri-soft:#dcebee;--acc:#cf5f14;--ok:#2c7a4b;--warn:#8a5200;--warn-bg:#fff2d6;--danger:#b3261e;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121719;--card:#1c2427;--ink:#e8eeee;--sub:#9fb0b4;--line:#33403f;--inbg:#151c1e;
    --pri:#3f8ea6;--pri-soft:#203a42;--acc:#e37a33;--ok:#5fbf86;--warn:#f0b65a;--warn-bg:#3a2d14;--danger:#ff8a80;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121719;--card:#1c2427;--ink:#e8eeee;--sub:#9fb0b4;--line:#33403f;--inbg:#151c1e;
  --pri:#3f8ea6;--pri-soft:#203a42;--acc:#e37a33;--ok:#5fbf86;--warn:#f0b65a;--warn-bg:#3a2d14;--danger:#ff8a80;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font:17px/1.5 "Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Noto Sans CJK JP","Yu Gothic UI",Meiryo,sans-serif;
  padding-bottom:calc(104px + env(safe-area-inset-bottom));-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;-webkit-appearance:none;appearance:none}
#bar{position:sticky;top:0;z-index:20;background:var(--pri);color:#fff;
  padding:calc(env(safe-area-inset-top) + 8px) 12px 10px;display:flex;align-items:center;gap:10px;min-height:60px}
#back{flex:0 0 auto;width:46px;height:46px;border:0;border-radius:12px;background:rgba(255,255,255,.16);color:#fff;font-size:28px;line-height:1}
#back[hidden]{display:none}
.ttl{flex:1;min-width:0}
.ttl b{display:block;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl small{display:block;font-size:12.5px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#saved{flex:0 0 auto;font-size:12px;opacity:.9;white-space:nowrap}
main{max-width:720px;margin:0 auto;padding-block:14px 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h2.sec{font-size:15px;color:var(--sub);margin:18px 2px 8px;font-weight:700}
p.lead{margin:2px 2px 12px;color:var(--sub);font-size:15px}

.btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;min-height:54px;padding:10px 14px;border-radius:14px;border:0;font-size:17px;font-weight:700;text-align:center}
.btn.pri{background:var(--pri);color:#fff}
.btn.acc{background:var(--acc);color:#fff}
.btn.ghost{background:var(--card);border:1.5px solid var(--line);color:var(--ink)}
.btn.add{background:var(--pri-soft);color:var(--pri);border:1.5px dashed var(--pri)}
.btn.danger{background:transparent;color:var(--danger);border:1.5px solid var(--line)}
.btn.sm{min-height:44px;font-size:15px;width:auto;padding:8px 14px}

.list{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.item{display:flex;align-items:stretch;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.item>.go{flex:1;min-width:0;text-align:left;background:none;border:0;padding:14px 16px;min-height:68px}
.item>.go b{display:block;font-size:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item>.go small{display:block;color:var(--sub);font-size:13.5px}
.item>.more{flex:0 0 52px;border:0;border-left:1px solid var(--line);background:none;font-size:22px;color:var(--sub)}
.tag{display:inline-block;font-size:11.5px;font-weight:700;padding:1px 8px;border-radius:999px;background:var(--acc);color:#fff;vertical-align:2px;margin-left:6px}
.tag.ok{background:var(--ok)}
.tag.w{background:var(--warn-bg);color:var(--warn)}
.day{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.day .top{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.day .top b{font-size:18px}
.day .top small{color:var(--sub);font-size:13px}
.day .meta{color:var(--sub);font-size:14px;margin:2px 0 10px}
.day .acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{position:relative;text-align:left;min-height:88px;padding:12px 14px;border-radius:16px;background:var(--card);border:1.5px solid var(--line)}
.tile b{display:block;font-size:17px;line-height:1.3}
.tile .st{display:block;font-size:13.5px;color:var(--sub);margin-top:4px}
.tile.done{border-color:color-mix(in srgb,var(--ok) 45%,var(--line))}
.tile.done .st{color:var(--ok);font-weight:700}
.tile .wn{position:absolute;top:8px;right:10px;font-size:12px;font-weight:700;color:var(--warn);background:var(--warn-bg);padding:1px 8px;border-radius:999px}

.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.card-h{display:flex;align-items:center;justify-content:space-between;margin:-2px 0 10px}
.card-h b{font-size:16px}
.card-h .x{border:0;background:none;color:var(--danger);font-size:14px;font-weight:700;min-height:40px;padding:0 4px}
.fld{margin:0 0 14px}
.fld:last-child{margin-bottom:0}
.fld>span{display:block;font-size:13.5px;color:var(--sub);font-weight:700;margin-bottom:5px}
.hint{display:block;font-style:normal;font-size:12.5px;color:var(--sub);margin-top:4px}
input,textarea{width:100%;font:inherit;font-size:18px;padding:11px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--inbg);color:var(--ink);min-height:52px}
textarea{min-height:96px;resize:vertical;line-height:1.5}
input:focus,textarea:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px color-mix(in srgb,var(--pri) 25%,transparent)}
input[type=time],input[type=date]{min-width:0}
.row{display:flex;gap:8px;align-items:center}
.row>input{flex:1;min-width:0}
.pre,.unit{flex:0 0 auto;color:var(--sub);font-weight:700;font-size:16px}
.tilde{flex:0 0 auto;color:var(--sub)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:46px;padding:8px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);font-size:16px}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:700}
.grp{font-size:13px;color:var(--sub);font-weight:700;margin:10px 0 6px}
.grp:first-child{margin-top:0}
.calc{margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--pri-soft);font-size:15px}
.calc b{font-size:20px}
.warnbox{background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:14.5px;margin-bottom:12px}
.warnbox ul{margin:4px 0 0;padding-left:1.2em}
.warnbox[hidden]{display:none}
.iv{display:grid;grid-template-columns:3.4em 1fr 1fr;gap:6px 8px;align-items:center}
.iv .h{font-size:12.5px;color:var(--sub);font-weight:700}
.iv .n{font-size:14px;color:var(--sub);font-weight:700}
.ivbtns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.stop{display:inline-block;margin-left:6px;font-size:12px;font-weight:700;color:#fff;background:var(--danger);padding:1px 8px;border-radius:999px;vertical-align:2px}
.tog{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:54px;padding:10px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);text-align:left;margin-bottom:8px;font-size:16px}
.tog .bx{flex:0 0 auto;width:26px;height:26px;border-radius:7px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff}
.tog.on{border-color:var(--pri)}
.tog.on .bx{background:var(--pri);border-color:var(--pri)}
.tog.auto{opacity:.75}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.install{background:var(--card);border:1.5px solid var(--acc);border-radius:16px;padding:12px 14px;margin-bottom:14px;font-size:14.5px}
.install b{display:block;font-size:16px;margin-bottom:2px}
.install .row{margin-top:8px;justify-content:flex-end}
.empty{text-align:center;color:var(--sub);padding:22px 10px;font-size:15px}

.foot{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--card);border-top:1px solid var(--line);
  padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;gap:10px;justify-content:center}
.foot>.btn{flex:1;max-width:345px}

#modal[hidden]{display:none}
.mask{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;background:var(--card);border-radius:20px 20px 0 0;padding:18px 16px calc(16px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.sheet h3{margin:0 0 8px;font-size:18px}
.sheet p{margin:0 0 14px;color:var(--sub);font-size:15px}
.sbtns{display:grid;gap:8px;margin-top:14px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom));z-index:60;background:#222;color:#fff;padding:10px 16px;border-radius:12px;font-size:15px;display:flex;gap:12px;align-items:center;max-width:92vw}
#toast[hidden]{display:none}
#toast button{background:var(--acc);border:0;color:#fff;border-radius:8px;padding:6px 10px;font-weight:700}
#busy{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;font-weight:700}
#busy[hidden]{display:none}

/* 閲覧（帳票プレビュー） */
.pv{overflow:hidden;border-radius:6px;box-shadow:0 1px 6px rgba(0,0,0,.25);margin:0 auto 12px;background:#fff}
.pv>.paper{transform-origin:0 0}
#paper-host{position:fixed;left:-30000px;top:0;pointer-events:none}

/* ===== 帳票（A4横 1123×794px） ===== */
.paper{width:1123px;height:794px;background:#fff;color:#000;padding:20px 28px;position:relative;overflow:hidden;
  font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Noto Sans CJK JP","Yu Gothic",Meiryo,sans-serif;font-size:10px;line-height:1.2}
.paper *{box-sizing:border-box}
.paper table{border-collapse:collapse;table-layout:fixed}
.paper td{border:1px solid #000;padding:0 3px;height:17px;vertical-align:middle;overflow:hidden;white-space:nowrap;font-weight:normal}
.paper .c{text-align:center}
.paper .r{text-align:right}
.paper .v{font-size:11px;font-weight:bold;color:#000}
.paper .wrap{white-space:normal;line-height:1.2;vertical-align:top;padding-top:1px}
.paper .nb{border:0}
.paper .dl{border-bottom:1px dashed #000}
.paper .cb{display:inline-block;width:10px;height:10px;border:1px solid #000;vertical-align:-1px;margin-left:3px;text-align:center;line-height:9px;font-size:10px;font-weight:bold}
.paper .p-title{text-align:center;font-size:20px;letter-spacing:10px;font-weight:bold;height:26px;text-decoration:underline}
.paper .p-no{position:absolute;right:28px;top:22px;font-size:10.5px}
.paper .blk{display:flex;gap:7px;margin-top:6px;align-items:flex-start}
.paper .sm{font-size:8.5px}
.paper .gbar{position:absolute;top:4px;height:11px;background:#444;color:#fff;font-size:7.5px;line-height:11px;padding:0 2px;overflow:hidden;white-space:nowrap}
.paper .gl{position:absolute;top:0;bottom:0;width:0;border-left:1px dotted #999}
.paper .cont{position:absolute;left:28px;bottom:16px;font-size:10px}
</style>
</head>
<body>
<header id="bar">
  <button id="back" aria-label="戻る" hidden>‹</button>
  <div class="ttl"><b id="t1">試錐日報</b><small id="t2"></small></div>
  <span id="saved"></span>
</header>
<main id="app"></main>
<div id="modal" hidden></div>
<div id="toast" hidden></div>
<div id="busy" hidden>PDFを作成しています…</div>
<div id="paper-host" aria-hidden="true"></div>
<datalist id="dl-names"></datalist>
<datalist id="dl-color"><option>茶褐<option>暗褐<option>黄褐<option>褐灰<option>灰<option>暗灰<option>青灰<option>灰白<option>黒<option>暗緑灰</datalist>
<datalist id="dl-geo"><option>表土<option>盛土<option>埋土<option>粘土<option>シルト<option>砂質シルト<option>粘土質シルト<option>砂<option>シルト質砂<option>細砂<option>中砂<option>粗砂<option>礫混り砂<option>砂礫<option>玉石混り砂礫<option>真砂土<option>強風化花崗岩<option>風化花崗岩<option>花崗岩<option>軟岩<option>硬岩</datalist>
<datalist id="dl-dia"><option>66<option>86<option>116<option>135</datalist>

<script>
'use strict';
const APP_VERSION = '0.1.1';

/* ---------- 基本ユーティリティ ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const clone = o => JSON.parse(JSON.stringify(o));
const pad = n => String(n).padStart(2, '0');
const z2h = s => String(s ?? '').replace(/[０-９．－]/g, c => c === '．' ? '.' : c === '－' ? '-' : String.fromCharCode(c.charCodeAt(0) - 0xFEE0));
const num = v => { if (v === '' || v == null) return null; const n = parseFloat(z2h(v)); return Number.isFinite(n) ? n : null; };
const f2 = n => n == null ? '' : (Math.round(n * 100) / 100).toFixed(2);
const hh = t => { if (!t) return null; const [h, m] = t.split(':').map(Number); return h + (m || 0) / 60; };
const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const WD = ['日','月','火','水','木','金','土'];
const ymd = s => { const [y, m, d] = (s || '').split('-').map(Number); return { y, m, d, w: y ? WD[new Date(y, m - 1, d).getDay()] : '' }; };
const fmtDate = (s, withYear) => { if (!s) return '日付未設定'; const t = ymd(s); return `${withYear ? t.y + '年' : ''}${t.m}月${t.d}日(${t.w})`; };
const fmtTime = ms => { if (!ms) return ''; const d = new Date(ms); return `${d.getMonth() + 1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };

/* ---------- 選択肢（日報様式に合わせる） ---------- */
const OPT = {
  weather: ['晴', '曇', '雨', '雪'],
  ashiba: [
    { g: '平坦', items: ['平坦 30cm以下', '平坦 30cm以上'] },
    { g: '湿地', items: ['湿地'] },
    { g: '傾斜', items: ['傾斜 15°〜30°', '傾斜 30°〜45°', '傾斜 45°〜60°'] },
    { g: '水上', items: ['水上 水深1m以下', '水上 水深3m以下', '水上 水深5m以下', '水上 水深10m以下'] },
    { g: '台船又はフロート', items: ['台船', 'フロート'] },
  ],
  hannyu: [
    { g: 'トラック', items: ['トラック 2t積2.9t吊', 'トラック 3t積2.9t吊', 'トラック 4t積2.9t吊'] },
    { g: '特装車運搬', items: ['特装車運搬 100m以下', '特装車運搬 100m〜300m', '特装車運搬 300m〜500m'] },
    { g: 'モノレール運搬', items: ['モノレール運搬 50m以下', 'モノレール運搬 50m〜100m', 'モノレール運搬 100m〜200m'] },
  ],
  yosui: ['動力噴霧機', '水道', '水運搬', '水中ポンプ'],
  kussaku: ['ノンコア', '半ペネ半コア', 'オールコア'],
  kind: ['小運搬', '仮設', '掘進', '試験', 'その他'],
  role: ['調査技士', '調査助手', 'その他'],
  sample: ['シンウォールサンプリング', 'デニソンサンプリング', 'トリプルサンプリング', 'その他'],
  tests: ['孔内水平載荷試験', '現場透水試験', 'シンウォールサンプリング', 'デニソンサンプリング', 'トリプルサンプリング'],
  geo: ['常時微動測定', 'PS検層(ダウンホール方式)', 'PS検層(孔内起振受振方式)', '密度検層', 'キャリパー検層'],
};
const MAX_WORKERS = 5, MAX_IV = 6;

/* ---------- データ ---------- */
let S = { v: 1, sites: [], holes: [], reports: [], names: [] };
const blankWorker = role => ({ role: role || '', name: '', from: '', to: '', stay: false });
const blankReport = () => ({
  id: uid(), holeId: '', date: '', no: '1', writer: '', weather: [],
  depth: { prev: '', end: '' },
  water: { before: '', after: '', during: '' },
  cond: { ashiba: '', hannyu: '', yosui: [], engine: '', pump: '', hammer: '', kussaku: '' },
  casing: [{ d: 'φ140', from: '', to: '' }, { d: 'φ115', from: '', to: '' }, { d: 'φ86', from: '', to: '' }],
  workers: [blankWorker('調査技士'), blankWorker('調査助手'), blankWorker('調査助手'), blankWorker('')],
  times: [], soils: [], nvals: [], drills: [], samples: [], tests: [], note: '',
  createdAt: Date.now(), updatedAt: Date.now(), pdfAt: 0,
});
const site = id => S.sites.find(x => x.id === id);
const hole = id => S.holes.find(x => x.id === id);
const report = id => S.reports.find(x => x.id === id);
const byUsed = (a, b) => (b.used || 0) - (a.used || 0);
const holesOf = sid => S.holes.filter(h => h.siteId === sid).sort(byUsed);
const reportsOf = hid => S.reports.filter(r => r.holeId === hid).sort((a, b) => (b.date || '').localeCompare(a.date || '') || b.createdAt - a.createdAt);

function touch(r) {
  const now = Date.now();
  if (r) { r.updatedAt = now; const h = hole(r.holeId); if (h) { h.used = now; const s = site(h.siteId); if (s) s.used = now; } }
  scheduleSave();
}
function rememberName(n) {
  n = (n || '').trim(); if (!n) return;
  S.names = [n, ...S.names.filter(x => x !== n)].slice(0, 40);
  $('#dl-names').innerHTML = S.names.map(x => `<option value="${esc(x)}">`).join('');
}

/* ---------- 保存（IndexedDB・自動保存） ---------- */
const DB_NAME = 'shisui-nippo', STORE = 'kv', KEY = 'state';
let idb = null, saveTimer = null;
function openIDB() {
  return new Promise(res => {
    try {
      const rq = indexedDB.open(DB_NAME, 1);
      rq.onupgradeneeded = () => rq.result.createObjectStore(STORE);
      rq.onsuccess = () => res(rq.result);
      rq.onerror = () => res(null);
    } catch (e) { res(null); }
  });
}
async function loadState() {
  idb = await openIDB();
  let s = null;
  if (idb) s = await new Promise(res => {
    try { const g = idb.transaction(STORE).objectStore(STORE).get(KEY); g.onsuccess = () => res(g.result || null); g.onerror = () => res(null); }
    catch (e) { res(null); }
  });
  if (!s) { try { const j = localStorage.getItem(DB_NAME); if (j) s = JSON.parse(j); } catch (e) {} }
  if (s && s.sites) S = Object.assign({ v: 1, sites: [], holes: [], reports: [], names: [] }, s);
}
function writeNow() {
  clearTimeout(saveTimer); saveTimer = null;
  const data = clone(S);
  const done = ok => { $('#saved').textContent = ok ? '✓ 保存済み' : '⚠ 保存できません'; };
  if (idb) {
    try {
      const tx = idb.transaction(STORE, 'readwrite');
      tx.objectStore(STORE).put(data, KEY);
      tx.oncomplete = () => done(true);
      tx.onerror = () => done(false);
      return;
    } catch (e) {}
  }
  try { localStorage.setItem(DB_NAME, JSON.stringify(data)); done(true); } catch (e) { done(false); }
}
function scheduleSave() {
  $('#saved').textContent = '保存中…';
  clearTimeout(saveTimer);
  saveTimer = setTimeout(writeNow, 250);
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && saveTimer) writeNow(); });
addEventListener('pagehide', () => { if (saveTimer) writeNow(); });

/* ---------- パス操作 ---------- */
function getPath(o, p) { return p.split('.').reduce((a, k) => a == null ? a : a[k], o); }
function setPath(o, p, v) {
  const ks = p.split('.'); let a = o;
  for (let i = 0; i < ks.length - 1; i++) a = a[ks[i]];
  a[ks[ks.length - 1]] = v;
}

/* ---------- 計算 ---------- */
function nCalc(t) {
  let b = 0, c = 0, filled = 0;
  for (const v of t.iv) { const bb = num(v.b), cc = num(v.c); if (bb != null) b += bb; if (cc != null) c += cc; if (bb != null && cc != null) filled++; }
  const s = num(t.start);
  const end = s != null ? s + c / 100 : null;
  const capped = b >= 50 && c < 30;
  return { b, c, filled, end, capped, label: filled ? (capped ? `${b}/${c}` : `${b}`) : '' };
}
function soilFrom(r, i) {
  const s = r.soils[i];
  return num(s.from);
}
function todayLen(r) { const p = num(r.depth.prev) ?? 0, e = num(r.depth.end); return e == null ? null : e - p; }

/* ---------- 入力チェック（警告のみ・保存は止めない） ---------- */
function warnings(r) {
  const W = [], w = (sec, msg) => W.push({ sec, msg });
  const p = num(r.depth.prev), e = num(r.depth.end);
  if (!r.date) w('basic', '作業日が入っていません');
  else if (S.reports.some(x => x !== r && x.holeId === r.holeId && x.date === r.date)) w('basic', '同じ作業日の日報がほかにもあります');
  if (p != null && e != null && e < p) w('basic', '本日の到達深度が前日より浅くなっています');
  r.casing.forEach(c => { const a = num(c.from), b = num(c.to); if (a != null && b != null && b < a) w('water', `ケーシング${c.d}の深度が逆になっています`); });
  const wa = num(r.water.before), wb = num(r.water.after);
  if (e != null && wb != null && wb > e + 0.001) w('water', '作業後の孔内水位が到達深度より深くなっています');
  if (e != null && wa != null && p != null && wa > p + 0.001 && p > 0) w('water', '作業前の孔内水位が前日の深度より深くなっています');
  r.workers.forEach((x, i) => {
    if (x.from && x.to && x.to <= x.from) w('workers', `${x.name || (i + 1) + '人目'}の作業時間の終了が開始より前です`);
    if ((x.from || x.to) && !x.name) w('workers', `${i + 1}人目の氏名が未入力です`);
  });
  r.times.forEach((t, i) => {
    const n = `${i + 1}件目`;
    if (!t.from || !t.to) w('times', `${n}の時刻が未入力です`);
    else if (t.to <= t.from) w('times', `${n}の終了時刻が開始より前です`);
    else if (hh(t.from) < 5 || hh(t.to) > 21) w('times', `${n}が帳票の時間帯（5時〜21時）からはみ出しています`);
    if (!t.kind) w('times', `${n}の工種が選ばれていません`);
  });
  let prevTo = null;
  r.soils.forEach((s, i) => {
    const a = num(s.from), b = num(s.to), n = `${i + 1}層目`;
    if (b == null) w('soils', `${n}の下端深度が未入力です`);
    if (a != null && b != null && b <= a) w('soils', `${n}の下端が上端より浅くなっています`);
    if (i > 0 && prevTo != null && a != null && Math.abs(a - prevTo) > 0.001) w('soils', `${n}の上端が前の層の下端（${f2(prevTo)}m）とつながっていません`);
    if (e != null && b != null && b > e + 0.001) w('soils', `${n}が本日の到達深度より深くなっています`);
    prevTo = b;
  });
  let prevS = null;
  r.nvals.forEach((t, i) => {
    const n = `${i + 1}回目`, c = nCalc(t), s = num(t.start);
    if (s == null) w('nvals', `${n}の開始深度が未入力です`);
    if (prevS != null && s != null && s <= prevS) w('nvals', `${n}の開始深度が前の試験より浅くなっています`);
    if (c.b > 50) w('nvals', `${n}の打撃回数の合計が50回を超えています`);
    if (c.c > 30) w('nvals', `${n}の貫入量の合計が30cmを超えています`);
    t.iv.forEach((v, j) => {
      const bb = num(v.b), cc = num(v.c);
      if (bb != null && cc == null) w('nvals', `${n}の${j + 1}区間目の貫入量が未入力です`);
      if (cc != null && cc > 10) w('nvals', `${n}の${j + 1}区間目の貫入量が10cmを超えています`);
    });
    if (c.filled === t.iv.length && c.filled > 0 && c.b < 50 && c.c < 30) w('nvals', `${n}は50回未満なのに貫入量が30cmに足りません`);
    if (e != null && c.end != null && c.end > e + 0.001) w('nvals', `${n}の終了深度が本日の到達深度より深くなっています`);
    prevS = s;
  });
  const rng = (list, sec, label) => {
    const ok = [];
    list.forEach((d, i) => {
      const a = num(d.from), b = num(d.to), n = `${label}${i + 1}件目`;
      if (a == null || b == null) w(sec, `${n}の区間が未入力です`);
      else if (b <= a) w(sec, `${n}の区間が逆になっています`);
      else ok.push({ a, b, i });
    });
    ok.sort((x, y) => x.a - y.a);
    for (let k = 1; k < ok.length; k++) if (ok[k].a < ok[k - 1].b - 0.001) w(sec, `${label}${ok[k - 1].i + 1}件目と${ok[k].i + 1}件目の区間が重なっています`);
  };
  rng(r.drills, 'drills', '');
  rng(r.samples, 'samples', '');
  r.samples.forEach((s, i) => { if (!s.kind) w('samples', `${i + 1}件目の種類が選ばれていません`); });
  return W;
}

/* ---------- 項目メニュー ---------- */
const SECTIONS = [
  { id: 'basic', t: '基本情報', st: r => r.date && r.writer && r.weather.length ? ['入力済', 1] : ['日付・天候・記入者', 0] },
  { id: 'cond', t: '現場条件', st: r => r.cond.ashiba || r.cond.hannyu || r.cond.kussaku ? ['設定済', 1] : ['足場・搬入・用水など', 0] },
  { id: 'water', t: '孔内水位・ケーシング', st: r => { const n = ['before', 'after'].filter(k => r.water[k] !== '').length; return n ? [`水位 ${n}/2`, n === 2] : ['未入力', 0]; } },
  { id: 'workers', t: '作業員', st: r => { const n = r.workers.filter(x => x.name).length; return n ? [`${n}名`, 1] : ['未入力', 0]; } },
  { id: 'times', t: '作業時間', st: r => r.times.length ? [`${r.times.length}件`, 1] : ['未入力', 0] },
  { id: 'soils', t: '土質', st: r => r.soils.length ? [`${r.soils.length}層`, 1] : ['未入力', 0] },
  { id: 'nvals', t: 'N値（標準貫入試験）', st: r => r.nvals.length ? [`${r.nvals.length}回`, 1] : ['未入力', 0] },
  { id: 'drills', t: '掘進状況', st: r => { const p = r.drills.filter(d => d.problem).length; return r.drills.length ? [`${r.drills.length}件${p ? `（問題 ${p}）` : ''}`, 1] : ['未入力', 0]; } },
  { id: 'samples', t: 'サンプリング', st: r => r.samples.length ? [`${r.samples.length}件`, 1] : ['なし', 0] },
  { id: 'tests', t: '試験・検層', st: r => { const n = testsOn(r).length; return n ? [`${n}項目`, 1] : ['なし', 0]; } },
  { id: 'note', t: '備考', st: r => r.note.trim() ? ['入力済', 1] : ['なし', 0] },
];
const secIdx = id => SECTIONS.findIndex(s => s.id === id);
const testsOn = r => [...new Set([...r.tests, ...r.samples.map(s => s.kind).filter(k => OPT.tests.includes(k))])];

/* ---------- 画面部品 ---------- */
const H = {
  fld: (label, inner, hint) => `<div class="fld"><span>${label}</span>${inner}${hint ? `<em class="hint">${hint}</em>` : ''}</div>`,
  txt: (k, v, ph = '', list = '') => `<input type="text" data-k="${k}" value="${esc(v)}" placeholder="${esc(ph)}"${list ? ` list="${list}"` : ''} autocomplete="off">`,
  dec: (k, v, ph = '') => `<input type="text" inputmode="decimal" data-k="${k}" data-num="1" value="${esc(v)}" placeholder="${esc(ph)}" autocomplete="off">`,
  int: (k, v, ph = '') => `<input type="text" inputmode="numeric" data-k="${k}" data-num="1" value="${esc(v)}" placeholder="${esc(ph)}" autocomplete="off">`,
  time: (k, v) => `<input type="time" data-k="${k}" value="${esc(v)}">`,
  area: (k, v, ph = '', rows = 3) => `<textarea data-k="${k}" rows="${rows}" placeholder="${esc(ph)}">${esc(v)}</textarea>`,
  gl: (k, v, ph = '0.00') => `<div class="row"><span class="pre">GL-</span>${H.dec(k, v, ph)}<span class="unit">m</span></div>`,
  range: (kf, vf, kt, vt) => `<div class="row"><span class="pre">GL-</span>${H.dec(kf, vf, '上端')}<span class="tilde">〜</span>${H.dec(kt, vt, '下端')}<span class="unit">m</span></div>`,
  chips: (k, opts, cur, multi) => `<div class="chips">${opts.map(o => {
    const on = multi ? (cur || []).includes(o) : cur === o;
    return `<button type="button" class="chip${on ? ' on' : ''}" data-act="${multi ? 'tog' : 'set'}" data-k="${k}" data-v="${esc(o)}">${esc(o)}</button>`;
  }).join('')}</div>`,
  groups: (k, groups, cur, short) => groups.map(g => `<div class="grp">${esc(g.g)}</div><div class="chips">${g.items.map(o => {
    const lab = short ? o.replace(g.g + ' ', '').replace(/^(水上|傾斜) /, '') : o;
    return `<button type="button" class="chip${cur === o ? ' on' : ''}" data-act="set" data-k="${k}" data-v="${esc(o)}">${esc(lab)}</button>`;
  }).join('')}</div>`).join(''),
};

/* ---------- 画面の描画 ---------- */
const app = $('#app');
let cur = null, curSec = null, route = [];
function setBar(t1, t2, back) {
  $('#t1').textContent = t1; $('#t2').textContent = t2 || '';
  const b = $('#back'); b.hidden = !back; b.onclick = () => go(back);
}
function foot(html) { return `<div class="foot">${html}</div>`; }

let curRoute = location.hash && location.hash.startsWith('#/') ? location.hash : '#/';
function go(h) { curRoute = h; try { if (location.hash !== h) history.pushState(null, '', h); } catch (e) {} render(); scrollTo(0, 0); }
function render() {
  const h = curRoute.slice(2).split('/');
  route = h; cur = null; curSec = null;
  const [kind, id, sec] = h;
  if (kind === 's' && site(id)) return renderHoles(site(id));
  if (kind === 'h' && hole(id)) return renderDays(hole(id));
  if (kind === 'r' && report(id)) { cur = report(id); if (sec && secIdx(sec) >= 0) { curSec = sec; return renderSection(cur, sec); } return renderMenu(cur); }
  if (kind === 'v' && report(id)) return renderView(report(id));
  return renderSites();
}
addEventListener('popstate', () => { const h = location.hash || '#/'; if (h.startsWith('#/') && h !== curRoute) { curRoute = h; render(); scrollTo(0, 0); } });
function rerender() { const y = scrollY; render(); scrollTo(0, y); }

const isStandalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const isIOS = () => /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

function renderSites() {
  setBar('試錐日報', '現場を選んでください', null);
  const list = [...S.sites].sort(byUsed);
  const install = !isStandalone() && !lsGet('hideInstall') ? `<div class="install"><b>ホーム画面に追加してください</b>
    ${isIOS() ? 'Safariの共有ボタン（□に↑）から「ホーム画面に追加」を選ぶと、電波がなくても使えるアプリになります。追加しないまま使うと、データが消えることがあります。'
      : 'ブラウザのメニュー（︙）から「ホーム画面に追加」または「アプリをインストール」を選ぶと、電波がなくても使えるアプリになります。'}
    <div class="row"><button class="btn ghost sm" data-act="hideInstall">閉じる</button></div></div>` : '';
  app.innerHTML = `${install}
    <ul class="list">${list.map((s, i) => {
      const hs = holesOf(s.id);
      return `<li class="item"><button class="go" data-go="#/s/${s.id}"><b>${esc(s.name)}${i === 0 && s.used ? '<span class="tag">前回</span>' : ''}</b>
        <small>孔 ${hs.length}本${s.used ? ' ・ 最終更新 ' + fmtTime(s.used) : ''}</small></button>
        <button class="more" data-act="siteMenu" data-id="${s.id}" aria-label="現場のメニュー">⋯</button></li>`;
    }).join('') || '<li class="empty">まだ現場がありません。<br>下の「新しい現場を追加」から始めてください。</li>'}</ul>
    <div style="height:12px"></div>
    <button class="btn add" data-act="addSite">＋ 新しい現場を追加</button>
    <h2 class="sec">データの書き出し・読み込み</h2>
    <div class="tools"><button class="btn ghost" data-act="exportAll">全データ書き出し</button>
      <button class="btn ghost" data-act="import">データ読み込み</button></div>
    <p class="lead" style="margin-top:10px;font-size:13px">代わりの人に引き継ぐときや、機種変更のときに使います。　ver ${APP_VERSION}</p>`;
}

function renderHoles(s) {
  setBar(s.name, '孔番号を選んでください', '#/');
  const list = holesOf(s.id);
  app.innerHTML = `<ul class="list">${list.map((h, i) => {
      const last = reportsOf(h.id)[0];
      return `<li class="item"><button class="go" data-go="#/h/${h.id}"><b>${esc(h.name)}${i === 0 && h.used ? '<span class="tag">前回</span>' : ''}</b>
        <small>${last ? `最終 ${fmtDate(last.date)} ・ GL-${f2(num(last.depth.end)) || '—'}m ・ 日報${reportsOf(h.id).length}日分` : 'まだ日報がありません'}</small></button>
        <button class="more" data-act="holeMenu" data-id="${h.id}" aria-label="孔のメニュー">⋯</button></li>`;
    }).join('') || '<li class="empty">この現場にはまだ孔番号がありません。</li>'}</ul>
    <div style="height:12px"></div>
    <button class="btn add" data-act="addHole" data-id="${s.id}">＋ 孔番号を追加</button>`;
}

function renderDays(h) {
  const s = site(h.siteId);
  setBar(`${h.name}`, `${s.name} ・ 作業日を選んでください`, `#/s/${s.id}`);
  const list = reportsOf(h.id);
  app.innerHTML = `<button class="btn acc" data-act="addDay" data-id="${h.id}">＋ 作業日を追加</button>
    <div style="height:14px"></div>
    <ul class="list">${list.map(r => {
      const wn = warnings(r).length;
      return `<li class="day"><div class="top"><b>${fmtDate(r.date, true)}</b><small>No.${esc(r.no)}</small></div>
        <div class="meta">GL-${f2(num(r.depth.prev) ?? 0)} → ${r.depth.end ? 'GL-' + f2(num(r.depth.end)) : '未入力'}m
          ${r.pdfAt ? `<span class="tag ok">PDF作成 ${fmtTime(r.pdfAt)}</span>` : ''}${wn ? `<span class="tag w">⚠ ${wn}</span>` : ''}</div>
        <div class="acts"><button class="btn ghost" data-go="#/v/${r.id}">閲覧</button><button class="btn pri" data-go="#/r/${r.id}">編集</button></div></li>`;
    }).join('') || '<li class="empty">まだ日報がありません。<br>上の「作業日を追加」から始めてください。</li>'}</ul>`;
}

function renderMenu(r) {
  const h = hole(r.holeId), s = site(h.siteId);
  setBar(`${fmtDate(r.date)} の日報`, `${s.name} ／ ${h.name}`, `#/h/${h.id}`);
  const W = warnings(r);
  app.innerHTML = `${W.length ? `<div class="warnbox">⚠ 確認が必要な項目が ${W.length}件 あります<ul>${W.slice(0, 6).map(x => `<li>${esc(x.msg)}</li>`).join('')}${W.length > 6 ? '<li>ほか…</li>' : ''}</ul></div>` : ''}
    <div class="tiles">${SECTIONS.map(sec => {
      const [st, done] = sec.st(r), wn = W.filter(x => x.sec === sec.id).length;
      return `<button class="tile${done ? ' done' : ''}" data-go="#/r/${r.id}/${sec.id}"><b>${sec.t}</b><span class="st">${done ? '✓ ' : ''}${esc(st)}</span>${wn ? `<span class="wn">⚠ ${wn}</span>` : ''}</button>`;
    }).join('')}</div>
    <div style="height:18px"></div>
    <button class="btn danger" data-act="delReport" data-id="${r.id}">この日報を削除</button>
    ${foot(`<button class="btn ghost" data-go="#/v/${r.id}">帳票を確認</button><button class="btn acc" data-act="pdf" data-id="${r.id}">PDFで送る</button>`)}`;
}

function secWarnHTML(r, sec) {
  const W = warnings(r).filter(x => x.sec === sec);
  return W.length ? `⚠ 確認してください<ul>${W.map(x => `<li>${esc(x.msg)}</li>`).join('')}</ul>` : '';
}

function renderSection(r, sec) {
  const h = hole(r.holeId), i = secIdx(sec), def = SECTIONS[i], next = SECTIONS[i + 1];
  setBar(def.t, `${fmtDate(r.date)} ・ ${h.name}`, `#/r/${r.id}`);
  const body = SEC[sec](r);
  const wh = secWarnHTML(r, sec);
  app.innerHTML = `<div class="warnbox" id="secwarn"${wh ? '' : ' hidden'}>${wh}</div>${body}
    ${foot(`<button class="btn ghost" data-go="#/r/${r.id}">‹ 項目一覧</button>${next ? `<button class="btn pri" data-go="#/r/${r.id}/${next.id}">次へ：${next.t} ›</button>` : `<button class="btn acc" data-go="#/v/${r.id}">帳票を確認 ›</button>`}`)}`;
  live();
}

function newReport(h, date) {
  const all = reportsOf(h.id);
  const prev = all.find(r => (r.date || '') < date) || all[0];
  const r = blankReport();
  r.holeId = h.id; r.date = date;
  r.no = String(Math.max(0, ...all.map(x => parseInt(x.no) || 0)) + 1);
  if (prev) {
    r.writer = prev.writer; r.cond = clone(prev.cond); r.casing = clone(prev.casing);
    r.workers = prev.workers.map(x => ({ role: x.role, name: x.name, from: x.from, to: x.to, stay: x.stay }));
    r.depth.prev = prev.depth.end || prev.depth.prev || '';
  }
  return r;
}

/* ---------- ダイアログ ---------- */
function openSheet(inner) { const m = $('#modal'); m.innerHTML = `<div class="mask"><div class="sheet" role="dialog" aria-modal="true">${inner}</div></div>`; m.hidden = false; return m; }
function closeSheet() { const m = $('#modal'); m.hidden = true; m.innerHTML = ''; m.onclick = null; }
function ask(title, msg, btns) {
  return new Promise(res => {
    const m = openSheet(`<h3>${esc(title)}</h3>${msg ? `<p>${msg}</p>` : ''}<div class="sbtns">${btns.map(b => `<button class="btn ${b.cls || 'ghost'}" data-r="${esc(b.v)}">${esc(b.t)}</button>`).join('')}</div>`);
    m.onclick = e => { const b = e.target.closest('[data-r]'); if (b) { closeSheet(); res(b.dataset.r || null); } else if (e.target.classList.contains('mask')) { closeSheet(); res(null); } };
  });
}
function promptText(title, label, val = '', type = 'text') {
  return new Promise(res => {
    const m = openSheet(`<form><h3>${esc(title)}</h3><div class="fld"><span>${esc(label)}</span><input name="v" type="${type}" value="${esc(val)}" autocomplete="off"></div>
      <div class="sbtns"><button class="btn pri">決定</button><button type="button" class="btn ghost" data-x="1">キャンセル</button></div></form>`);
    const f = m.querySelector('form'), inp = f.elements.v;
    if (type === 'text') setTimeout(() => inp.focus(), 60);
    f.onsubmit = e => { e.preventDefault(); const v = inp.value.trim(); closeSheet(); res(v || null); };
    m.onclick = e => { if (e.target.dataset.x || e.target.classList.contains('mask')) { closeSheet(); res(null); } };
  });
}
let toastTimer;
function toast(msg, btn, fn) {
  const t = $('#toast'); t.innerHTML = `<span>${esc(msg)}</span>${btn ? `<button>${esc(btn)}</button>` : ''}`; t.hidden = false;
  if (btn) t.querySelector('button').onclick = () => { t.hidden = true; fn(); };
  clearTimeout(toastTimer); if (!btn) toastTimer = setTimeout(() => { t.hidden = true; }, 3200);
}

/* ---------- ファイルを送る・保存する ---------- */
async function shareOrSave(blob, name, type) {
  const file = new File([blob], name, { type });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: name }); return 'shared'; }
    catch (e) { if (e && e.name === 'AbortError') return 'cancel'; }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
  return 'saved';
}
const inFrame = () => { try { return window.self !== window.top; } catch (e) { return true; } };
async function trialNotice() {
  await ask('お試し版では送れません', 'このお試し版では、PDFやデータファイルの保存・送信ができません。GitHub Pagesに置いた版をホーム画面に追加すると使えます。帳票の見た目は「帳票を確認」で見られます。', [{ t: 'OK', v: '' }]);
}
const safeName = s => String(s || '').replace(/[\\/:*?"<>|\s]+/g, '_');

/* ---------- データの書き出し・読み込み（引き継ぎ用） ---------- */
async function exportData(holeIds, label) {
  if (inFrame()) return trialNotice();
  if (!holeIds.length) { toast('書き出すデータがありません'); return; }
  const holes = S.holes.filter(h => holeIds.includes(h.id));
  const data = { app: 'shisui-nippo', v: 1, exportedAt: Date.now(),
    sites: S.sites.filter(s => holes.some(h => h.siteId === s.id)), holes, reports: S.reports.filter(r => holeIds.includes(r.holeId)), names: S.names };
  const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
  const d = new Date();
  const res = await shareOrSave(blob, `日報データ_${safeName(label)}_${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}.json`, 'application/json');
  if (res !== 'cancel') toast('データを書き出しました');
}
function importData() {
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.json,application/json';
  inp.onchange = async () => {
    const f = inp.files[0]; if (!f) return;
    let d; try { d = JSON.parse(await f.text()); } catch (e) { await ask('読み込めませんでした', 'このアプリで書き出したデータファイルを選んでください。', [{ t: 'OK', v: '' }]); return; }
    if (d.app !== 'shisui-nippo' || !Array.isArray(d.reports)) { await ask('読み込めませんでした', 'このアプリで書き出したデータファイルではありません。', [{ t: 'OK', v: '' }]); return; }

const contentKey = r => { const x = clone(r); ['id', 'holeId', 'createdAt', 'updatedAt', 'pdfAt'].forEach(k => delete x[k]); return JSON.stringify(x); };
async function mergeData(d) {
  const siteMap = {}, holeMap = {}; let add = 0, same = 0, over = 0, keep = 0;
  for (const s of d.sites || []) {
    let l = S.sites.find(x => x.name === s.name);
    if (!l) { l = { id: uid(), name: s.name, used: s.used || Date.now() }; S.sites.push(l); }
    siteMap[s.id] = l.id;
  }
  for (const h of d.holes || []) {
    const sid = siteMap[h.siteId]; if (!sid) continue;
    let l = S.holes.find(x => x.siteId === sid && x.name === h.name);
    if (!l) { l = { id: uid(), siteId: sid, name: h.name, used: h.used || Date.now() }; S.holes.push(l); }
    holeMap[h.id] = l.id;
  }
  for (const r of d.reports) {
    const hid = holeMap[r.holeId]; if (!hid) continue;
    const ex = S.reports.find(x => x.holeId === hid && x.date === r.date);
    const nr = Object.assign(blankReport(), clone(r), { id: uid(), holeId: hid });
    if (!ex) { S.reports.push(nr); add++; continue; }
    if (contentKey(ex) === contentKey(nr)) { same++; continue; }
    const h = hole(hid);
    const a = await ask('同じ日の日報が両方にあります', `${esc(site(h.siteId).name)} ／ ${esc(h.name)}<br><b>${fmtDate(r.date, true)}</b> の内容が違います。どちらを残しますか？`,
      [{ t: `読み込んだデータを残す（更新 ${fmtTime(r.updatedAt)}）`, v: 'in', cls: 'pri' }, { t: `このスマホのデータを残す（更新 ${fmtTime(ex.updatedAt)}）`, v: 'keep' }]);
    if (a === 'in') { S.reports[S.reports.indexOf(ex)] = Object.assign(nr, { id: ex.id }); over++; } else keep++;
  }
  (d.names || []).slice().reverse().forEach(rememberName);
  touch(); writeNow(); render();
  await ask('読み込みが終わりました', `追加 ${add}日分 ／ 上書き ${over}日分 ／ そのまま ${keep + same}日分`, [{ t: 'OK', v: '' }]);
}

/* ---------- PDF作成 ---------- */
function loadScript(src) {
  return new Promise((res, rej) => { if (document.querySelector(`script[src="${src}"]`)) return res(); const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
}
async function buildPDF(r) {
  await loadScript('lib/html2canvas.min.js');
  await loadScript('lib/jspdf.umd.min.js');
  const host = $('#paper-host');
  const pages = paperPages(r);
  const pdf = new window.jspdf.jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4', compress: true });
  for (let i = 0; i < pages.length; i++) {
    host.innerHTML = pages[i];
    const cv = await window.html2canvas(host.firstElementChild, { scale: 2.5, backgroundColor: '#ffffff', logging: false, width: 1123, height: 794, windowWidth: 1123 });
    if (i) pdf.addPage('a4', 'landscape');
    pdf.addImage(cv.toDataURL('image/jpeg', 0.9), 'JPEG', 0, 0, 297, 210);
  }
  host.innerHTML = '';
  const h = hole(r.holeId), s = site(h.siteId);
  return { blob: pdf.output('blob'), name: `試錐日報_${safeName(s.name)}_${safeName(h.name)}_${(r.date || '').replace(/-/g, '')}.pdf` };
}
async function makePDF(r) {
  if (inFrame()) return trialNotice();
  const W = warnings(r);
  if (W.length) {
    const a = await ask(`確認が必要な項目が ${W.length}件 あります`, `<ul style="margin:0;padding-left:1.2em">${W.slice(0, 8).map(x => `<li>${esc(x.msg)}</li>`).join('')}</ul>`,
      [{ t: 'このままPDFを作る', v: 'go', cls: 'acc' }, { t: '戻って直す', v: '' }]);
    if (!a) return;
  }
  $('#busy').hidden = false;
  try {
    if (saveTimer) writeNow();
    const { blob, name } = await buildPDF(r);
    $('#busy').hidden = true;
    const res = await shareOrSave(blob, name, 'application/pdf');
    if (res !== 'cancel') { r.pdfAt = Date.now(); touch(); toast(res === 'shared' ? 'PDFを送りました' : 'PDFを保存しました'); }
  } catch (e) {
    console.error(e);
    $('#busy').hidden = true;
    await ask('PDFを作れませんでした', '一度アプリを閉じて開き直してから、もう一度お試しください。', [{ t: 'OK', v: '' }]);
  }
}

/* ---------- 起動 ---------- */
(async function start() {
  await loadState();
  $('#dl-names').innerHTML = S.names.map(x => `<option value="${esc(x)}">`).join('');
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  render();
  $('#saved').textContent = '';
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    try {
      const reg = await navigator.serviceWorker.register('sw.js');
      const offer = w => toast('新しいバージョンがあります', '更新する', () => { if (saveTimer) writeNow(); w.postMessage('skip'); });
      if (reg.waiting && navigator.serviceWorker.controller) offer(reg.waiting);
      reg.addEventListener('updatefound', () => {
        const w = reg.installing;
        w && w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) offer(w); });
      });
      let reloaded = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => { if (!reloaded) { reloaded = true; location.reload(); } });
    } catch (e) {}
  }
})();
